<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>لا يوجد اتصال</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f8f6;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#133;text-align:center}
  .box{max-width:420px;padding:32px}
  h1{font-size:22px;margin:0 0 10px;color:#0A6B3B} p{margin:6px 0;line-height:1.8;color:#456}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#0A6B3B;margin:0 3px;animation:b 1.2s infinite} .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
  button{margin-top:16px;padding:10px 22px;border:0;border-radius:8px;background:#0A6B3B;color:#fff;font:inherit;cursor:pointer}
</style></head><body><div class="box">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تأكد من الشبكة. سيعود التطبيق تلقائيًا فور رجوع الاتصال.</p>
  <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  <button onclick="go()">إعادة المحاولة الآن</button>
</div>
<script>
  var target = new URLSearchParams(location.search).get('u') || 'https://app.mahawirtech.com';
  function go(){ location.replace(target); }
  function probe(){ fetch(target, { mode: 'no-cors', cache: 'no-store' }).then(go, function(){}); }
  setInterval(probe, 4000);
</script></body></html>
